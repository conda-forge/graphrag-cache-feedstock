schema_version: 1

context:
  version: 3.1.2
  python_min: '3.11'

package:
  name: graphrag-cache
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/graphrag-cache/graphrag_cache-${{ version }}.tar.gz
  sha256: 40dc0ce40028d1194e59ce32df4856b35b8c1e1ef1d508210ed8aaae67afb719

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.27.0,<2.0.0
    - pip
  run:
    - python >=${{ python_min }},<3.14
    - graphrag-common ==3.1.2
    - graphrag-storage ==3.1.2
tests:
  - python:
      imports:
        - graphrag_cache
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: GraphRAG cache package.
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/graphrag-cache/
  repository: https://github.com/microsoft/graphrag

extra:
  recipe-maintainers:
    - jan-janssen
